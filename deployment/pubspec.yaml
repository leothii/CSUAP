name: csuap
description: On-device photo protection with a fixed universal adversarial perturbation.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  cupertino_icons: ^1.0.8
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  gal: ^2.3.2
  google_fonts: ^6.2.1
  image: ^4.5.4
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cs_uap_v_f32_hwc.bin
    - assets/fonts/
  fonts:
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
